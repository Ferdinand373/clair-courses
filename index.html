<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dceefa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clair Courses">
<title>Clair Courses · Clair Sync</title>
<style>
html,body{min-height:100%;margin:0;background:#eef6fb;color:#17364a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{display:grid;min-height:100vh;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 90% 0,rgba(169,214,239,.62),transparent 25rem),linear-gradient(180deg,#eef8fd,#f8fbfd)}
.card{width:min(420px,100%);padding:30px 20px;border:1px solid rgba(255,255,255,.92);border-radius:28px;background:rgba(255,255,255,.82);box-shadow:0 20px 60px rgba(39,88,119,.12)}
.card strong{display:block;font-size:1.45rem}.card p{margin:8px 0 0;color:#728793;line-height:1.45}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="card"><strong>Clair Courses</strong><p>Ouverture avec Clair Sync…</p></div></div>
<script>
(async()=>{
'use strict';

const STABLE_COMMIT='f0c871a958583c72b766027da84f193806a2bbe1';
const CACHE_KEY='clairCourses.clairSync.stable.v1';
const SOURCES=[
  `https://cdn.jsdelivr.net/gh/Ferdinand373/clair-courses@${STABLE_COMMIT}/index.html?v=clairsync1`,
  `https://raw.githubusercontent.com/Ferdinand373/clair-courses/${STABLE_COMMIT}/index.html?v=clairsync1`
];


function __CC_CLAIR_SYNC_TRANSFORM(html){
  try{
    const syncScript = `
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></scr`+`ipt>
<script>
(()=>{
'use strict';

const CC_SYNC_VERSION='Clair Sync 1.0';
const SUPABASE_URL='https://ryyewskgfgysfubesdsj.supabase.co';
const SUPABASE_KEY='sb_publishable_T9Dmg9VKTdMFdCuLVxD54w_7GeH3Q6S';
const STATE_KEY='clairCourses.state';
const USAGE_KEY='clairCourses.usage.v10';
const PREVIOUS_KEY='clairCourses.previousList.v9';
const REMOTE_KEY='clairCourses.state';
const RELOAD_GUARD='clairSync.cc.reload.v1';

let client=null,user=null,syncing=false,lastRaw='',timer=null;

function deviceLabel(){
  const u=navigator.userAgent||'';
  const p=/iPhone/i.test(u)?'iPhone':/iPad/i.test(u)?'iPad':/Android/i.test(u)?'Android':/Windows/i.test(u)?'Ordinateur Windows':/Macintosh|Mac OS X/i.test(u)?'Mac':'Appareil';
  const b=/Edg\\//.test(u)?'Edge':/CriOS|Chrome\\//.test(u)?'Chrome':/Safari\\//.test(u)&&!/Chrome\\//.test(u)&&!/CriOS/.test(u)?'Safari':'Web';
  return p+' • '+b;
}
function parseKey(key){
  try{
    const raw=localStorage.getItem(key);
    return raw===null?null:JSON.parse(raw);
  }catch{return null}
}
function stable(v){try{return JSON.stringify(v)}catch{return String(v)}}
function normName(v){
  return String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').trim().toLowerCase().replace(/\\s+/g,' ');
}
function mergeProducts(primary=[],secondary=[]){
  const out=[],seen=new Set();
  for(const p of [...(Array.isArray(primary)?primary:[]),...(Array.isArray(secondary)?secondary:[])]){
    if(!p)continue;
    const name=typeof p==='string'?p:(p.name??p.label??p.article??'');
    const k=normName(name);
    if(!k||seen.has(k))continue;
    seen.add(k);out.push(p);
  }
  return out;
}
function mergeState(localState,remoteState){
  if(!localState&& !remoteState)return null;
  if(!localState)return remoteState;
  if(!remoteState)return localState;

  const lt=Number(localState.updatedAt)||0;
  const rt=Number(remoteState.updatedAt)||0;
  const localWins=lt>=rt;
  const newest=localWins?localState:remoteState;
  const older=localWins?remoteState:localState;

  return {
    ...older,
    ...newest,
    items:Array.isArray(newest.items)?newest.items:[],
    products:mergeProducts(newest.products,older.products),
    updatedAt:Math.max(lt,rt,Date.now()),
    version:Math.max(Number(localState.version)||0,Number(remoteState.version)||0)
  };
}
function setBadge(text,kind='ok'){
  let b=document.getElementById('clair-sync-badge');
  if(!b){
    const row=document.querySelector('.brand-row')||document.querySelector('header')||document.body;
    b=document.createElement('div');b.id='clair-sync-badge';
    b.style.cssText='position:relative;z-index:4;flex:0 0 auto;margin-left:auto;padding:7px 10px;border:1px solid rgba(57,127,169,.18);border-radius:999px;background:rgba(236,247,252,.92);color:#286b93;font-size:.64rem;font-weight:900;letter-spacing:.02em;white-space:nowrap';
    row.appendChild(b);
  }
  b.textContent=text;
  if(kind==='wait'){b.style.opacity='.68'}
  else if(kind==='off'){b.style.color='#7c6b50';b.style.background='rgba(250,247,241,.92)'}
  else {b.style.color='#286b93';b.style.background='rgba(236,247,252,.92)';b.style.opacity='1'}
}
function writeLocal(key,value){
  try{
    if(value===undefined||value===null)localStorage.removeItem(key);
    else localStorage.setItem(key,JSON.stringify(value));
  }catch{}
}
async function getRemote(){
  const r=await client.from('clair_data')
    .select('payload,revision,updated_at')
    .eq('user_id',user.id)
    .eq('app_id','clair-courses')
    .eq('data_key',REMOTE_KEY)
    .is('deleted_at',null)
    .maybeSingle();
  if(r.error)throw r.error;
  return r.data||null;
}
async function pushRemote(row,state,usage,previous){
  const now=new Date().toISOString();
  const r=await client.from('clair_data').upsert({
    user_id:user.id,
    app_id:'clair-courses',
    data_key:REMOTE_KEY,
    payload:{
      value:state,
      usage:usage??null,
      previousList:previous??null,
      source_device:deviceLabel(),
      synced_at:now,
      integration:'clair-sync-1.0'
    },
    schema_version:1,
    revision:(row?.revision||0)+1,
    deleted_at:null,
    updated_at:now
  },{onConflict:'user_id,app_id,data_key'});
  if(r.error)throw r.error;
}
async function syncNow(reason='auto'){
  if(syncing||!user||!navigator.onLine)return;
  syncing=true;setBadge('Clair Sync…','wait');
  try{
    const localState=parseKey(STATE_KEY);
    const localUsage=parseKey(USAGE_KEY);
    const localPrevious=parseKey(PREVIOUS_KEY);
    const row=await getRemote();
    const remoteState=row?.payload?.value||null;
    const merged=mergeState(localState,remoteState);

    if(!merged){
      setBadge('Clair Sync ✓'); syncing=false; return;
    }

    const localBefore=stable(localState);
    const mergedText=stable(merged);

    // The newest active list wins; "Mes produits" are safely united.
    if(mergedText!==localBefore){
      writeLocal(STATE_KEY,merged);
    }

    const remoteUsage=row?.payload?.usage;
    const usage=localUsage??remoteUsage??null;
    const previous=localPrevious??row?.payload?.previousList??null;
    await pushRemote(row,merged,usage,previous);

    lastRaw=localStorage.getItem(STATE_KEY)||'';
    setBadge('Clair Sync ✓');

    // If data arrived from the other device, reload once so the visible list is current.
    if(mergedText!==localBefore && sessionStorage.getItem(RELOAD_GUARD)!=='1'){
      sessionStorage.setItem(RELOAD_GUARD,'1');
      setTimeout(()=>location.reload(),120);
      return;
    }
    sessionStorage.removeItem(RELOAD_GUARD);
  }catch(err){
    console.warn('Clair Sync',err);
    setBadge(navigator.onLine?'Clair Sync en attente':'Clair Sync hors ligne','off');
  }finally{
    syncing=false;
  }
}
function schedule(delay=500){
  clearTimeout(timer);
  timer=setTimeout(()=>syncNow('change'),delay);
}
async function bootSync(){
  setBadge('Clair Sync…','wait');
  if(!window.supabase){setBadge('Clair Sync en attente','off');return}
  try{
    client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
      auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}
    });
    const s=await client.auth.getSession();
    user=s.data?.session?.user||null;
    if(!user){
      setBadge('Clair Sync : connexion requise','off');
      return;
    }
    lastRaw=localStorage.getItem(STATE_KEY)||'';
    await syncNow('open');

    // Detect changes made by Clair Courses itself without modifying its code.
    setInterval(()=>{
      const raw=localStorage.getItem(STATE_KEY)||'';
      if(raw!==lastRaw){lastRaw=raw;schedule(650)}
    },1200);
  }catch(err){
    console.warn('Clair Sync boot',err);
    setBadge('Clair Sync en attente','off');
  }
}
window.addEventListener('online',()=>schedule(200));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule(250)});
setTimeout(bootSync,350);
})();
</scr`+`ipt>`;
    return html.replace('</body>',syncScript+'</body>');
  }catch(error){
    console.warn('Clair Sync transform',error);
    return html;
  }
}


let source='';
for(const url of SOURCES){
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(r.ok){
      const t=await r.text();
      if(t.includes('Clair Courses V13.1')&&t.includes('const transformSource=__CC_V131_TRANSFORM.toString();')){
        source=t;
        try{localStorage.setItem(CACHE_KEY,t)}catch{}
        break;
      }
    }
  }catch{}
}
if(!source){
  try{source=localStorage.getItem(CACHE_KEY)||''}catch{}
}
if(!source){
  document.getElementById('boot').innerHTML='<div class="card"><strong>Clair Courses ne peut pas s’ouvrir.</strong><p>Vérifiez la connexion puis rechargez la page.</p></div>';
  return;
}

// Inject Clair Sync into the proven V13.1 wrapper, without changing the shopping engine.
try{
  source=source.replace(
    'function __CC_V131_TRANSFORM(html){',
    __CC_CLAIR_SYNC_TRANSFORM.toString()+'\nfunction __CC_V131_TRANSFORM(html){'
  );
  source=source.replace(
    'const transformSource=__CC_V131_TRANSFORM.toString();',
    'const transformSource=__CC_V131_TRANSFORM.toString()+"\\n"+__CC_CLAIR_SYNC_TRANSFORM.toString();'
  );
  source=source.replace(
    "source=source.replace('document.write(html);','html=__CC_V131_TRANSFORM(html);document.write(html);');",
    "source=source.replace('document.write(html);','html=__CC_V131_TRANSFORM(html);html=__CC_CLAIR_SYNC_TRANSFORM(html);document.write(html);');"
  );

  const ok=source.includes('__CC_CLAIR_SYNC_TRANSFORM') &&
           source.includes('html=__CC_V131_TRANSFORM(html);html=__CC_CLAIR_SYNC_TRANSFORM(html);document.write(html);');
  if(!ok)throw new Error('Injection Clair Sync non validée');
}catch(err){
  console.warn('Clair Sync: mode sûr, V13.1 inchangée',err);
}

document.open();
document.write(source);
document.close();
})();
</script>
</body>
</html>
