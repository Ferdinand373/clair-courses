<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ed">
<title>Clair Courses V11.8</title>
<style>
html,body{min-height:100%;margin:0;background:#f6f4ed;color:#203128;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{display:grid;min-height:100vh;place-items:center;padding:24px;text-align:center}
.boot strong{font-size:1.35rem}.boot p{color:#66736b;line-height:1.45}
</style>
</head>
<body>
<div class="boot" id="boot"><div><strong>Clair Courses V11.8</strong><p>Ouverture et vérification de vos données…</p></div></div>
<script>
(async()=>{
'use strict';

/*
 * V11.8 — correctif ciblé :
 * « Mes produits » est affiché en ordre alphabétique français A → Z.
 *
 * Cette enveloppe repart exactement de la V11.7 validée au commit ci-dessous,
 * puis injecte uniquement le correctif de tri avant son exécution.
 */
const V117_COMMIT='ca971ada48ddaee0117fc8d5c8e14f6084cd0d11';
const SOURCES=[
  `https://cdn.jsdelivr.net/gh/Ferdinand373/clair-courses@${V117_COMMIT}/index.html?v=118az`,
  `https://raw.githubusercontent.com/Ferdinand373/clair-courses/${V117_COMMIT}/index.html?v=118az`
];

let source='';
for(const url of SOURCES){
  try{
    const response=await fetch(url,{cache:'no-store'});
    if(response.ok){
      const text=await response.text();
      if(text.includes('Clair Courses V11.7')){
        source=text;
        break;
      }
    }
  }catch{}
}

if(!source){
  document.getElementById('boot').innerHTML=
    '<div><strong>Clair Courses ne peut pas s’ouvrir.</strong><p>Vérifiez la connexion, puis rechargez la page.</p></div>';
  return;
}

/*
 * Inséré dans le moteur V11.7 juste avant son document.open().
 * On retire le classement par fréquence d'utilisation et on conserve
 * uniquement un tri alphabétique localisé en français.
 */
const alphaPatch = `
/* V11.8 — Mes produits : ordre alphabétique A → Z uniquement. */
html=html.replace(
  '.slice().sort((a,b)=>(Number(usage[productKey(b.name)])||0)-(Number(usage[productKey(a.name)])||0)||a.name.localeCompare(b.name,"fr"));',
  '.slice().sort((a,b)=>a.name.localeCompare(b.name,"fr",{sensitivity:"base"}));'
);
`;

if(!source.includes('document.open();')){
  document.getElementById('boot').innerHTML=
    '<div><strong>Clair Courses V11.8</strong><p>La base V11.7 attendue n’a pas été reconnue.</p></div>';
  return;
}

source=source.replace('document.open();',alphaPatch+'\ndocument.open();');

/* Identification visuelle de cette correction, sans toucher aux données. */
source=source.replaceAll('Clair Courses V11.7','Clair Courses V11.8');
source=source.replaceAll('Version 11.7 stable','Version 11.8 stable');
source=source.replaceAll("badge.textContent='V11.7'","badge.textContent='V11.8'");
source=source.replaceAll("document.title='Clair Courses V11.7'","document.title='Clair Courses V11.8'");

document.open();
document.write(source);
document.close();
})();
</script>
</body>
</html>
