<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ed">
<title>Clair Courses V12.0</title>
<style>
html,body{min-height:100%;margin:0;background:#f6f4ed;color:#203128;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{display:grid;min-height:100vh;place-items:center;padding:24px;text-align:center}
.boot strong{font-size:1.35rem}.boot p{color:#66736b;line-height:1.45}
</style>
</head>
<body>
<div class="boot" id="boot"><div><strong>Clair Courses V12.0</strong><p>Ouverture et vérification de vos données…</p></div></div>
<script>
(async()=>{
'use strict';

/*
 * V12.0 — ajout manuel toujours accessible.
 * Repart de la V11.7 stable, conserve les protections V11.7,
 * le tri et le catalogue enrichi V11.9, et expose ➕ Ajouter en permanence.
 */
const V117_COMMIT='ca971ada48ddaee0117fc8d5c8e14f6084cd0d11';
const SOURCES=[
  `https://cdn.jsdelivr.net/gh/Ferdinand373/clair-courses@${V117_COMMIT}/index.html?v=120add`,
  `https://raw.githubusercontent.com/Ferdinand373/clair-courses/${V117_COMMIT}/index.html?v=120add`
];

let source='';
for(const url of SOURCES){
  try{
    const response=await fetch(url,{cache:'no-store'});
    if(response.ok){
      const text=await response.text();
      if(text.includes('Clair Courses V11.7')){
        source=text;
        break;
      }
    }
  }catch{}
}

if(!source){
  document.getElementById('boot').innerHTML=
    '<div><strong>Clair Courses ne peut pas s’ouvrir.</strong><p>Vérifiez la connexion, puis rechargez la page.</p></div>';
  return;
}

const v120Patch="/* V12.0 — ajout manuel permanent + catalogue V11.9 conservé. */\nconst V120_CATALOGUE=[{\"name\":\"Eau\",\"quantity\":\"1 pack de 6 × 1,5 L\",\"aisle\":\"Eau\"},{\"name\":\"Pain\",\"quantity\":\"1 baguette\",\"aisle\":\"Boulangerie\"},{\"name\":\"Lait\",\"quantity\":\"1 bouteille 1 L\",\"aisle\":\"Crèmerie\"},{\"name\":\"Beurre\",\"quantity\":\"1 plaquette 250 g\",\"aisle\":\"Crèmerie\"},{\"name\":\"Café\",\"quantity\":\"1 paquet 250 g\",\"aisle\":\"Épicerie\"},{\"name\":\"Papier aluminium\",\"quantity\":\"1 rouleau\",\"aisle\":\"Maison\"},{\"name\":\"Sacs-poubelle\",\"quantity\":\"1 rouleau\",\"aisle\":\"Maison\"},{\"name\":\"Courgettes\",\"quantity\":\"à l’unité\",\"aisle\":\"Fruits et légumes\"},{\"name\":\"Ail\",\"quantity\":\"1 tête\",\"aisle\":\"Fruits et légumes\"},{\"name\":\"Carottes\",\"quantity\":\"1 sachet 1 kg\",\"aisle\":\"Fruits et légumes\"},{\"name\":\"Citrons\",\"quantity\":\"2 pièces\",\"aisle\":\"Fruits et légumes\"},{\"name\":\"Oignons\",\"quantity\":\"1 filet 1 kg\",\"aisle\":\"Fruits et légumes\"},{\"name\":\"Pommes de terre\",\"quantity\":\"1 filet 2,5 kg\",\"aisle\":\"Fruits et légumes\"},{\"name\":\"Salade\",\"quantity\":\"1 pièce\",\"aisle\":\"Fruits et légumes\"},{\"name\":\"Tomates\",\"quantity\":\"1 barquette 500 g\",\"aisle\":\"Fruits et légumes\"},{\"name\":\"Œufs\",\"quantity\":\"1 boîte de 6\",\"aisle\":\"Crèmerie\"},{\"name\":\"Crème fraîche\",\"quantity\":\"1 pot 20 cl\",\"aisle\":\"Crèmerie\"},{\"name\":\"Fromage râpé\",\"quantity\":\"1 sachet 200 g\",\"aisle\":\"Crèmerie\"},{\"name\":\"Parmesan\",\"quantity\":\"1 sachet 100 g\",\"aisle\":\"Crèmerie\"},{\"name\":\"Yaourts nature\",\"quantity\":\"1 pack de 4\",\"aisle\":\"Crèmerie\"},{\"name\":\"Riz\",\"quantity\":\"1 paquet 1 kg\",\"aisle\":\"Épicerie\"},{\"name\":\"Pâtes\",\"quantity\":\"1 paquet 500 g\",\"aisle\":\"Épicerie\"},{\"name\":\"Semoule\",\"quantity\":\"1 paquet 500 g\",\"aisle\":\"Épicerie\"},{\"name\":\"Farine\",\"quantity\":\"1 paquet 1 kg\",\"aisle\":\"Épicerie\"},{\"name\":\"Sucre\",\"quantity\":\"1 paquet 1 kg\",\"aisle\":\"Épicerie\"},{\"name\":\"Sel\",\"quantity\":\"1 paquet\",\"aisle\":\"Épicerie\"},{\"name\":\"Poivre\",\"quantity\":\"1 moulin\",\"aisle\":\"Épicerie\"},{\"name\":\"Huile d’olive\",\"quantity\":\"1 bouteille 75 cl\",\"aisle\":\"Épicerie\"},{\"name\":\"Huile neutre\",\"quantity\":\"1 bouteille 1 L\",\"aisle\":\"Épicerie\"},{\"name\":\"Vinaigre\",\"quantity\":\"1 bouteille 75 cl\",\"aisle\":\"Épicerie\"},{\"name\":\"Moutarde\",\"quantity\":\"1 pot\",\"aisle\":\"Épicerie\"},{\"name\":\"Mayonnaise\",\"quantity\":\"1 pot\",\"aisle\":\"Épicerie\"},{\"name\":\"Ketchup\",\"quantity\":\"1 flacon\",\"aisle\":\"Épicerie\"},{\"name\":\"Miel\",\"quantity\":\"1 pot\",\"aisle\":\"Épicerie\"},{\"name\":\"Sauce soja\",\"quantity\":\"1 bouteille 15 cl\",\"aisle\":\"Épicerie\"},{\"name\":\"Paprika\",\"quantity\":\"1 pot\",\"aisle\":\"Épicerie\"},{\"name\":\"Curry\",\"quantity\":\"1 pot\",\"aisle\":\"Épicerie\"},{\"name\":\"Tomates concassées\",\"quantity\":\"1 boîte 400 g\",\"aisle\":\"Conserves\"},{\"name\":\"Concentré de tomate\",\"quantity\":\"1 tube\",\"aisle\":\"Épicerie\"},{\"name\":\"Pois chiches\",\"quantity\":\"1 boîte 400 g\",\"aisle\":\"Conserves\"},{\"name\":\"Haricots rouges\",\"quantity\":\"1 boîte 400 g\",\"aisle\":\"Conserves\"},{\"name\":\"Maïs\",\"quantity\":\"1 boîte 300 g\",\"aisle\":\"Conserves\"},{\"name\":\"Thon au naturel\",\"quantity\":\"1 boîte 140 g\",\"aisle\":\"Conserves\"},{\"name\":\"Papier cuisson\",\"quantity\":\"1 rouleau\",\"aisle\":\"Maison\"},{\"name\":\"Film alimentaire\",\"quantity\":\"1 rouleau\",\"aisle\":\"Maison\"},{\"name\":\"Essuie-tout\",\"quantity\":\"1 paquet de 2\",\"aisle\":\"Maison\"},{\"name\":\"Papier toilette\",\"quantity\":\"1 paquet de 6\",\"aisle\":\"Hygiène\"},{\"name\":\"Liquide vaisselle\",\"quantity\":\"1 flacon 500 ml\",\"aisle\":\"Maison\"},{\"name\":\"Éponges\",\"quantity\":\"1 paquet de 3\",\"aisle\":\"Maison\"},{\"name\":\"Lessive\",\"quantity\":\"1 bidon\",\"aisle\":\"Maison\"}];\nconst V120_BASE_NAMES=[\"Eau\",\"Pain\",\"Lait\",\"Beurre\",\"Café\",\"Papier aluminium\",\"Sacs-poubelle\",\"Courgettes\"];\n\nhtml=html.replace(\n  /const DEFAULT_PRODUCTS=\\[[\\s\\S]*?\\n  \\];/,\n  'const DEFAULT_PRODUCTS='+JSON.stringify(V120_CATALOGUE)+';\\n  const BASE_PRODUCT_NAMES_V120='+JSON.stringify(V120_BASE_NAMES)+';'\n);\n\nhtml=html.replace(\n  'const products=Array.isArray(source.products)?source.products:DEFAULT_PRODUCTS;',\n  'const savedProductsV120=Array.isArray(source.products)?source.products:null;const legacyBaseV120=Array.isArray(savedProductsV120)&&savedProductsV120.length===8&&BASE_PRODUCT_NAMES_V120.every(name=>savedProductsV120.some(product=>productKey(product.name)===productKey(name)));const products=!savedProductsV120||legacyBaseV120?DEFAULT_PRODUCTS:savedProductsV120;'\n);\n\nhtml=html.replace(\n  '.slice().sort((a,b)=>(Number(usage[productKey(b.name)])||0)-(Number(usage[productKey(a.name)])||0)||a.name.localeCompare(b.name,\"fr\"));',\n  '.slice().sort((a,b)=>a.name.localeCompare(b.name,\"fr\",{sensitivity:\"base\"}));'\n);\nhtml=html.replace(\n  'Les produits les plus souvent choisis apparaissent en premier. Touchez un produit pour l’ajouter.',\n  'Vos produits habituels sont classés de A à Z. Touchez un produit pour l’ajouter.'\n);\n\n/* V12.0 : rendre l'ajout manuel impossible à perdre de vue. */\nhtml=html.replace(\n  '</style>',\n  `.action-bar-inner{grid-template-columns:repeat(5,minmax(0,1fr))}#bar-add{color:#fff;background:var(--accent);border-radius:12px}#bar-add .action-icon{font-size:1.35rem}body.course-mode .action-bar{display:block!important}body.course-mode .action-bar-inner{display:flex;justify-content:center}body.course-mode .action:not(#bar-add){display:none!important}body.course-mode #bar-add{display:grid!important;min-width:150px;max-width:220px}body.course-mode .app{padding-bottom:calc(98px + env(safe-area-inset-bottom))}@media(max-width:370px){.action-bar-inner{grid-template-columns:repeat(5,minmax(0,1fr))}.action{font-size:.63rem}}</style>`\n);\n\nhtml=html.replace(\n  '<div class=\"action-bar-inner\">',\n  '<div class=\"action-bar-inner\"><button class=\"action\" id=\"bar-add\" type=\"button\"><span class=\"action-icon\">➕</span><span>Ajouter</span></button>'\n);\n\nhtml=html.replace(\n  'els.barList.addEventListener(\"click\",()=>scrollToId(\"list-title\"));',\n  'document.getElementById(\"bar-add\")?.addEventListener(\"click\",()=>openItemDialog());els.barList.addEventListener(\"click\",()=>scrollToId(\"list-title\"));'\n);\n\n/* Exemple concret V12.0 : porc/échine doit rester en Boucherie en saisie manuelle. */\nhtml=html.replace(\n  'const aisle=isAisle(requestedAisle)?requestedAisle:classify(parts.original);',\n  'let aisle=isAisle(requestedAisle)?requestedAisle:classify(parts.original);if(/(?:^| )(?:echines?|porc)(?: |$)/.test(normalize(parts.original)))aisle=\"Boucherie\";'\n);\n";

if(!source.includes('document.open();')){
  document.getElementById('boot').innerHTML=
    '<div><strong>Clair Courses V12.0</strong><p>La base V11.7 attendue n’a pas été reconnue.</p></div>';
  return;
}

source=source.replace('document.open();',v120Patch+'\ndocument.open();');

source=source.replaceAll('Clair Courses V11.7','Clair Courses V12.0');
source=source.replaceAll('Version 11.7 stable','Version 12.0 stable');
source=source.replaceAll("badge.textContent='V11.7'","badge.textContent='V12.0'");
source=source.replaceAll("document.title='Clair Courses V11.7'","document.title='Clair Courses V12.0'");

document.open();
document.write(source);
document.close();
})();
</script>
</body>
</html>
