<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f4ed">
<title>Clair Courses V11.1</title>
<style>html,body{min-height:100%;margin:0;background:#f6f4ed;color:#203128;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{display:grid;min-height:100vh;place-items:center;padding:24px;text-align:center}.boot strong{font-size:1.35rem}.boot p{color:#66736b;line-height:1.45}</style>
</head><body><div class="boot" id="boot"><div><strong>Clair Courses V11.1</strong><p>Ouverture et protection de « Mes produits »…</p></div></div>
<script>
(async()=>{
'use strict';
const COMMIT='acb52ba8f4b1f9d78f2c3f55c2d3d6362342bca0';
const CACHE_KEY='clairCourses.shell.v11.1.produitsProteges';
const SOURCES=[`https://cdn.jsdelivr.net/gh/Ferdinand373/clair-courses@${COMMIT}/index.html?v=111p`, `https://raw.githubusercontent.com/Ferdinand373/clair-courses/${COMMIT}/index.html?v=111p`];
let html='';
for(const url of SOURCES){try{const r=await fetch(url,{cache:'no-store'});if(r.ok){const t=await r.text();if(t.includes('const APP_VERSION=1009;')){html=t;try{localStorage.setItem(CACHE_KEY,t)}catch{}break}}}catch{}}
if(!html){try{html=localStorage.getItem(CACHE_KEY)||''}catch{}}
if(!html){document.getElementById('boot').innerHTML='<div><strong>Clair Courses ne peut pas s’ouvrir.</strong><p>Vérifiez la connexion, puis rechargez la page.</p></div>';return}

const protection=`
const PRODUCTS_SHADOW_KEY="clairCourses.products.secours.v109";
function recoverSavedProducts(){
  const candidates=[];
  const add=value=>{
    if(!Array.isArray(value))return;
    const cleaned=value.map(makeProduct).filter(Boolean);
    if(cleaned.length)candidates.push(cleaned);
  };
  try{add(JSON.parse(localStorage.getItem(PRODUCTS_SHADOW_KEY)||"[]"))}catch{}
  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i); if(!key)continue;
      let data=null; try{data=JSON.parse(localStorage.getItem(key)||"null")}catch{continue}
      if(Array.isArray(data)){add(data);continue}
      if(data&&typeof data==="object"){
        add(data.products);add(data.favorites);add(data.habituels);add(data.favourites);add(data.favoris);
        if(data.data&&typeof data.data==="object"){add(data.data.products);add(data.data.favorites);add(data.data.habituels)}
      }
    }
  }catch{}
  candidates.sort((a,b)=>b.length-a.length);
  return candidates[0]||[];
}
`;
html=html.replace('let state=loadState();', protection+`\nlet state=loadState();\n{
 const recovered=recoverSavedProducts();
 if(recovered.length>state.products.length)state.products=uniqueProducts([...recovered,...state.products]);
}`);
html=html.replace(
'function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({appVersion:APP_VERSION,release:APP_RELEASE,items:state.items,products:state.products,favorites:state.products}))}',
'function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({appVersion:APP_VERSION,release:APP_RELEASE,items:state.items,products:state.products,favorites:state.products}));try{localStorage.setItem(PRODUCTS_SHADOW_KEY,JSON.stringify(state.products))}catch{}}'
);
html=html.replace('</body>',`<script>(()=>{try{const badge=document.querySelector('.version-pill');if(badge)badge.textContent='V11.1'}catch{}})();<\/script></body>`);
document.open();document.write(html);document.close();
})();
</script></body></html>
