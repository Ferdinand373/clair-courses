<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Clair Courses">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Clair Courses — V10.11 test vérifié</title>
  <style>
    :root{color-scheme:light;--bg:#f6f4ed;--surface:#fffefa;--text:#203128;--muted:#66736b;--accent:#2f6b4f;--danger:#8b3c35}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;display:grid;place-items:center;padding:28px;color:var(--text);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{width:min(520px,100%);padding:30px 24px;border-radius:26px;background:var(--surface);text-align:center;box-shadow:0 18px 45px rgba(36,61,48,.12)}
    .mark{width:62px;height:62px;margin:0 auto 18px;display:grid;place-items:center;border-radius:18px;color:#fff;background:var(--accent);font-size:30px}
    h1{margin:0 0 10px;font-size:29px}p{margin:0;color:var(--muted);line-height:1.5}.loader{width:42px;height:42px;margin:24px auto 0;border:4px solid rgba(47,107,79,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .85s linear infinite}.error{display:none;margin-top:20px;padding:14px;border-radius:14px;color:#6f2f2a;background:#f3e1dc;text-align:left}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="boot" aria-live="polite">
    <div class="mark">🛒</div>
    <h1>Clair Courses</h1>
    <p id="status">Ouverture de la V10.11 vérifiée…</p>
    <div class="loader" id="loader" aria-hidden="true"></div>
    <div class="error" id="error"></div>
  </main>
<script>
(()=>{
  'use strict';
  const STABLE_COMMIT='acb52ba8f4b1f9d78f2c3f55c2d3d6362342bca0';
  const SOURCES=[
    `https://cdn.jsdelivr.net/gh/Ferdinand373/clair-courses@${STABLE_COMMIT}/index.html?v=1011`,
    `https://raw.githubusercontent.com/Ferdinand373/clair-courses/${STABLE_COMMIT}/index.html?v=1011`
  ];
  const SOURCE_CACHE=`clair-courses-source-${STABLE_COMMIT}-v1011-verified`;
  const SOURCE_KEY=new Request('./source-v109-v1011-verified.html');
  const status=document.getElementById('status');
  const loader=document.getElementById('loader');
  const errorBox=document.getElementById('error');

  function valid(html){return typeof html==='string'&&html.length>15000&&html.includes('<!doctype html>')&&html.includes('const APP_VERSION=1009;')&&html.includes('function parseChat')&&html.includes('function importChat')&&!html.includes('data-v1011-verified')}
  function req(html,before,after,label){if(!html.includes(before))throw new Error(`Correction impossible : ${label} introuvable`);return html.replace(before,after)}
  function injectBeforeBodyEnd(html,code){const marker='</body>';if(!html.includes(marker))throw new Error('Fin de page introuvable');return html.replace(marker,`${code}\n${marker}`)}

  function patch(html){
    let p=html;
    p=req(p,'<span class="version-pill">V10.9</span>','<span class="version-pill">V10.11</span>','numéro de version');
    p=req(p,'const APP_RELEASE="10.9";','const APP_RELEASE="10.11";','version interne');
    p=req(p,'Clair Courses — Version 10.9 stable','Clair Courses — Version 10.11 test vérifié','version des réglages');
    p=req(p,'<button class="primary-action alt" id="quick-chat" type="button"><span>✨</span>Coller depuis Chat</button>','<button class="primary-action" id="quick-chat" type="button"><span>📋</span>Coller une liste</button>','bouton principal');
    p=req(p,'<span class="action-icon">✨</span><span>Chat</span>','<span class="action-icon">📋</span><span>Coller</span>','bouton inférieur');
    p=req(p,'Coller la liste préparée par Chat','Coller la liste copiée','titre de collage');
    p=req(p,'Ajoutez un article ou collez la liste préparée avec Chat.','Ajoutez un article ou collez une liste de courses.','texte liste vide');
    p=req(p,'Ajoutez un article, collez la liste préparée avec Chat ou ouvrez Mes produits.','Ajoutez un article, collez une liste de courses ou ouvrez Mes produits.','aide liste vide');
    p=req(p,'<label>Liste de courses<span class="label-hint">Les titres de rayons ne deviennent jamais des articles.</span><textarea class="field" id="chat-text"','<label>Liste de courses<span class="label-hint">Touchez le bouton vert ci-dessous. Si iOS le demande, autorisez le collage.</span><textarea class="field" id="chat-text"','aide collage');
    p=req(p,'<button class="secondary-button" id="paste-button" type="button">Coller depuis le presse-papiers</button>','<button class="primary-button" id="paste-button" type="button">📋 Coller le texte copié</button><p id="paste-help" style="margin:-4px 0 0;color:#66736b;font-size:.88rem;line-height:1.4">La liste apparaîtra dans la zone blanche.</p>','bouton presse-papiers');

    p=req(p,
`const DEFAULT_PRODUCTS=[
    {name:"Eau",quantity:"",aisle:"Eau"},{name:"Pain",quantity:"",aisle:"Boulangerie"},
    {name:"Lait",quantity:"",aisle:"Crèmerie"},{name:"Beurre",quantity:"",aisle:"Crèmerie"},
    {name:"Café",quantity:"",aisle:"Épicerie"},{name:"Papier aluminium",quantity:"",aisle:"Maison"},
    {name:"Sacs-poubelle",quantity:"",aisle:"Maison"},{name:"Courgettes",quantity:"à l’unité | filet de 4/5",aisle:"Fruits et légumes"}
  ];`,
`const DEFAULT_PRODUCTS=[
    {name:"Eau",quantity:"",aisle:"Eau"},{name:"Pain",quantity:"",aisle:"Boulangerie"},
    {name:"Lait",quantity:"",aisle:"Crèmerie"},{name:"Beurre",quantity:"",aisle:"Crèmerie"},
    {name:"Café",quantity:"",aisle:"Épicerie"},{name:"Papier aluminium",quantity:"",aisle:"Maison"},
    {name:"Sacs-poubelle",quantity:"",aisle:"Maison"},{name:"Courgettes",quantity:"à l’unité | filet de 4/5",aisle:"Fruits et légumes"},
    {name:"Câpres",quantity:"1 pot",aisle:"Épicerie"},{name:"Moutarde",quantity:"1 pot",aisle:"Épicerie"},
    {name:"Jus de veau",quantity:"1 pot",aisle:"Épicerie"},{name:"Crème liquide",quantity:"1 brique",aisle:"Crèmerie"},
    {name:"Crème fraîche",quantity:"1 pot",aisle:"Crèmerie"},{name:"Concentré de tomate",quantity:"1 tube",aisle:"Épicerie"},
    {name:"Bouillon",quantity:"1 boîte",aisle:"Épicerie"},{name:"Lait de coco",quantity:"1 boîte",aisle:"Épicerie"},
    {name:"Sauce soja",quantity:"1 bouteille",aisle:"Épicerie"}
  ];`,'produits conditionnés');

    p=req(p,'"Épicerie":["café","céréale","chocolat","biscuit","farine","huile","moutarde","pâtes","riz","semoule","sel","sucre","thé","vinaigre","épice","sauce","condiment","gnocchi"],','"Épicerie":["café","céréale","chocolat","biscuit","farine","huile","moutarde","pâtes","riz","semoule","sel","sucre","thé","vinaigre","épice","sauce","condiment","gnocchi","câpre","câpres","jus de veau","fond de veau","concentré de tomate","bouillon","lait de coco"],','classement');

    const oldParse='  function parseChat(text){let aisle=null;const rows=[];for(const raw of String(text||"").split(/\\r?\\n/)){const parsed=parseLine(raw,aisle);if(!parsed||parsed.skip)continue;if(parsed.heading){aisle=parsed.heading;continue}parsed.aisle=resolveAisle(parsed.name,parsed.quantity,parsed.aisle||aisle);if(!fakeHeading(parsed))rows.push(parsed)}return rows}';
    const newParse=`  const PURCHASE_RULES=[
    {name:"Crème fraîche",aliases:["creme fraiche"],quantity:"1 pot",aisle:"Crèmerie"},
    {name:"Crème liquide",aliases:["creme liquide","creme fleurette"],quantity:"1 brique",aisle:"Crèmerie"},
    {name:"Câpres",aliases:["capre","capres"],quantity:"1 pot",aisle:"Épicerie"},
    {name:"Moutarde",aliases:["moutarde"],quantity:"1 pot",aisle:"Épicerie"},
    {name:"Jus de veau",aliases:["jus de veau","jus veau","fond de veau","fond veau"],quantity:"1 pot",aisle:"Épicerie"},
    {name:"Concentré de tomate",aliases:["concentre de tomate","concentre tomate"],quantity:"1 tube",aisle:"Épicerie"},
    {name:"Bouillon",aliases:["cube de bouillon","bouillon cube","bouillon de volaille","bouillon de boeuf","bouillon de legumes"],quantity:"1 boîte",aisle:"Épicerie"},
    {name:"Lait de coco",aliases:["lait de coco"],quantity:"1 boîte",aisle:"Épicerie"},
    {name:"Sauce soja",aliases:["sauce soja","sauce de soja"],quantity:"1 bouteille",aisle:"Épicerie"},
    {name:"Crème",aliases:["creme"],quantity:"1 brique",aisle:"Crèmerie"}
  ];
  function spoonIngredient(raw){const line=clean(String(raw||"").replace(/^\\s*[-•·▪▫◦‣⁃–—*✓✔☐☑]+\\s*/,"").replace(/\\*\\*/g,""),220);const match=line.match(/^(?:\\d+(?:[.,]\\d+)?|[¼½¾])\\s*(?:(?:c(?:uill(?:e|è)re)?s?|cuill(?:e|è)res?)\\.?\\s*(?:a|à)\\s*(?:soupe|cafe|café)|c\\.?\\s*(?:a|à)\\s*(?:soupe|cafe|café)|cas|cac)\\s*(?:de|d[’'])?\\s+(.+)$/i);return match?clean(match[1],140):""}
  function isRecipeMeasure(raw){const line=clean(String(raw||"").replace(/^\\s*[-•·▪▫◦‣⁃–—*✓✔☐☑]+\\s*/,""),220);return Boolean(spoonIngredient(line)||/^(?:\\d+(?:[.,]\\d+)?|[¼½¾])\\s*(?:kg|g|l|cl|ml)\\b/i.test(line))}
  function purchaseRuleFor(name){return PURCHASE_RULES.find(rule=>rule.aliases.some(alias=>hasSemanticKeyword(name,alias)))||null}
  function savedPurchaseProduct(name){return state.products.find(product=>productKey(product.name)===productKey(name))||null}
  function firstProductChoice(product){const choices=productChoices(product);return choices[0]||clean(product?.quantity,80)}
  function purchaseRow(parsed,raw){let row={...parsed};const spoon=spoonIngredient(raw);if(spoon){row.name=spoon.charAt(0).toUpperCase()+spoon.slice(1);row.quantity=""}const rule=purchaseRuleFor(row.name);if(rule){const saved=savedPurchaseProduct(rule.name);return {name:saved?.name||rule.name,quantity:firstProductChoice(saved)||rule.quantity,aisle:saved?.aisle||rule.aisle}}const saved=savedPurchaseProduct(row.name);if(saved&&firstProductChoice(saved)&&isRecipeMeasure(raw))return {name:saved.name,quantity:firstProductChoice(saved),aisle:saved.aisle};return row}
  function ensurePurchaseProducts(){for(const rule of PURCHASE_RULES){if(!savedPurchaseProduct(rule.name))state.products.push(makeProduct({name:rule.name,quantity:rule.quantity,aisle:rule.aisle}))}}
  function parseChat(text){let aisle=null;const rows=[];for(const raw of String(text||"").split(/\\r?\\n/)){const parsed=parseLine(raw,aisle);if(!parsed||parsed.skip)continue;if(parsed.heading){aisle=parsed.heading;continue}const purchased=purchaseRow(parsed,raw);purchased.aisle=resolveAisle(purchased.name,purchased.quantity,purchased.aisle||aisle,raw);if(!fakeHeading(purchased))rows.push(purchased)}return rows}`;
    p=req(p,oldParse,newParse,'conversion des mesures');
    p=req(p,'  let state=loadState();\n  let usage=loadJson(USAGE_KEY,{});','  let state=loadState();\n  ensurePurchaseProducts();\n  let usage=loadJson(USAGE_KEY,{});','conditionnements mémorisés');
    p=req(p,'<body>','<body data-v1011-verified="true">','marqueur');

    const robust=`<style id="v1011-ui-fix">
#quick-chat{background:#2f6b4f!important;color:#fff!important;opacity:1!important;pointer-events:auto!important}
#paste-button{min-height:54px;opacity:1!important;pointer-events:auto!important}
#chat-text{min-height:210px}
.v1011-note{padding:10px 12px;border-radius:12px;background:#eef4ef;color:#24543f;font-size:.88rem;line-height:1.35}
</style>
<script id="v1011-ui-script">(()=>{
 const byId=id=>document.getElementById(id);
 const openPaste=()=>{const d=byId('chat-dialog');if(!d)return;if(typeof d.showModal==='function'){if(!d.open)d.showModal()}else d.setAttribute('open','');setTimeout(()=>byId('paste-button')?.focus(),30)};
 for(const id of ['quick-chat','bar-chat']){const b=byId(id);if(b){b.disabled=false;b.removeAttribute('disabled');b.setAttribute('aria-disabled','false');b.addEventListener('click',openPaste,true)}}
 const paste=byId('paste-button'),area=byId('chat-text'),help=byId('paste-help');
 if(paste&&area){paste.disabled=false;paste.removeAttribute('disabled');paste.addEventListener('click',async event=>{event.preventDefault();event.stopImmediatePropagation();let text='';try{text=await navigator.clipboard.readText()}catch(_){text=''}if(text.trim()){area.value=text;area.dispatchEvent(new Event('input',{bubbles:true}));area.focus();if(help)help.textContent='Liste collée. Touchez maintenant « Ajouter la liste ».'}else{area.focus();if(help)help.textContent='Maintenez votre doigt dans la zone blanche, puis choisissez « Coller ».'}},true)}
 const form=byId('chat-form');if(form){form.addEventListener('submit',()=>{if(help)help.textContent='Ajout de la liste…'},true)}
 window.__V1011_READY__=Boolean(byId('quick-chat')&&byId('chat-dialog')&&byId('chat-text')&&byId('paste-button'));
})();<\/script>`;
    p=injectBeforeBodyEnd(p,robust);
    return p;
  }

  async function fetchSource(){let last=null;for(const url of SOURCES){try{const r=await fetch(url,{cache:'no-store',mode:'cors'});if(!r.ok)throw new Error(`Réponse ${r.status}`);const h=await r.text();if(!valid(h))throw new Error('Source incomplète');return h}catch(e){last=e}}throw last||new Error('Source inaccessible')}
  async function readCache(){if(!('caches'in window))return null;const c=await caches.open(SOURCE_CACHE);const r=await c.match(SOURCE_KEY);if(!r)return null;const h=await r.text();return valid(h)?h:null}
  async function saveCache(h){if(!('caches'in window))return;const c=await caches.open(SOURCE_CACHE);await c.put(SOURCE_KEY,new Response(h,{headers:{'content-type':'text/html;charset=utf-8'}}))}
  function fail(m){loader.style.display='none';status.textContent='Clair Courses V10.11 n’a pas pu s’ouvrir.';errorBox.style.display='block';errorBox.textContent=m}
  async function boot(){let h=null;try{h=await fetchSource();await saveCache(h)}catch(_){h=await readCache()}if(!h){fail('Une connexion est nécessaire lors de la première ouverture. Votre liste actuelle reste intacte.');return}const out=patch(h);status.textContent='Clair Courses V10.11 est prêt.';document.open();document.write(out);document.close()}
  boot().catch(e=>fail(e?.message||'Rechargez cette page une fois.'));
})();
</script>
</body>
</html>
